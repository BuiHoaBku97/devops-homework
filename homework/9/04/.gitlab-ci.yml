image: eclipse-temurin:17-jdk

stages:
  - test
  - build
  - dockerize

variables:
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: postgres
  POSTGRES_DB: cartdb
  CORE_DB_URL: jdbc:postgresql://postgres:5432/cartdb
  CORE_DB_USERNAME: postgres
  CORE_DB_PW: postgres
  CART_SERVICE_PORT: "8080"
  GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle"

test_job:
  stage: test
  services:
    - name: postgres:17-alpine
      alias: postgres
  cache:
    key: gradle-cache
    paths:
      - .gradle/wrapper
      - .gradle/caches
  before_script:
    - chmod +x gradlew
  script:
    - ./gradlew test

build_job:
  stage: build
  cache:
    key: gradle-cache
    paths:
      - .gradle/wrapper
      - .gradle/caches
  before_script:
    - chmod +x gradlew
  script:
    - ./gradlew bootJar -x test
  artifacts:
    name: user-service-artifact
    paths:
      - build/libs/*-SNAPSHOT.jar
    expire_in: 1 days

dockerize_job:
  stage: dockerize
  image: docker:latest
  services:
    - name: docker:dind
      alias: docker
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  before_script:
    - echo "$DOCKER_PASSWORD" | docker login --username "$DOCKER_USERNAME" --password-stdin
  script:
    - docker build -t "$DOCKER_USERNAME/user-service:latest" .
    - docker push "$DOCKER_USERNAME/user-service:latest"
